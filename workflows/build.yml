name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter pyautogui pyperclip pygetwindow

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name WMS_Automator main.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: WMS_Automator_EXE
        path: dist/WMS_Automator.exe
