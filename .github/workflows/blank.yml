name: Build Windows EXE

on:
  push:
    branches: [ "main", "master", "devin/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter pyautogui pyperclip pygetwindow Pillow pytesseract keyboard

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name WMS_Automator --collect-all customtkinter main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: WMS_Automator-${{ github.run_number }}
        path: dist/WMS_Automator.exe

    - name: Public Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v7.0.${{ github.run_number }}
        name: Release v7.0.${{ github.run_number }}
        files: dist/WMS_Automator.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
